services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:?set PGDATABASE in .env}
      POSTGRES_USER: ${PGUSER:?set PGUSER in .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    volumes:
      - evidence_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  identity-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  identity:
    image: quay.io/keycloak/keycloak:26.6.4
    restart: unless-stopped
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: ${KEYCLOAK_PGHOST:?set KEYCLOAK_PGHOST in .env}
      KC_DB_URL_PORT: ${KEYCLOAK_PGPORT:-5432}
      KC_DB_URL_DATABASE: ${KEYCLOAK_PGDATABASE:?set KEYCLOAK_PGDATABASE in .env}
      KC_DB_USERNAME: ${KEYCLOAK_PGUSER:?set KEYCLOAK_PGUSER in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_PGPASSWORD:?set KEYCLOAK_PGPASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: ${OIDC_PUBLIC_URL:?set OIDC_PUBLIC_URL in .env}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    networks: [private]

  evidence:
    build:
      context: ../..
      dockerfile: method/service/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: ${EVIDENCE_PGHOST:?set EVIDENCE_PGHOST in .env}
      PGPORT: ${EVIDENCE_PGPORT:-5432}
      PGDATABASE: ${EVIDENCE_PGDATABASE:?set EVIDENCE_PGDATABASE in .env}
      PGUSER: ${EVIDENCE_PGUSER:?set EVIDENCE_PGUSER in .env}
      PGPASSWORD: ${EVIDENCE_PGPASSWORD:?set EVIDENCE_PGPASSWORD in .env}
      MCP_OIDC_ISSUER_URL: ${OIDC_PUBLIC_URL:?set OIDC_PUBLIC_URL in .env}/realms/evidence
      MCP_OIDC_JWKS_URL: http://identity:8080/realms/evidence/protocol/openid-connect/certs
      MCP_OIDC_AUDIENCE: evidence-mcp
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?set MCP_PUBLIC_URL in .env}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:?set MCP_ALLOWED_HOSTS in .env}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-}
      UI_SESSION_SECRET: ${UI_SESSION_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PORT: 8000
    depends_on:
      identity:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [private]

networks:
  private:

volumes:
  evidence_data:
  identity_data:
